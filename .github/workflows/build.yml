name: Build Client

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Redirect gitee submodule to github mirror
        run: git config --global url."https://github.com/raphaelcheung/zircon-legend-library".insteadOf "https://gitee.com/raphaelcheung/zircon-legend-library"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: NuGet restore
        shell: cmd
        run: nuget restore "Zircon Client.sln" -PackagesDirectory packages
      - name: Build x86
        shell: cmd
        run: msbuild "Zircon Client.sln" /p:Configuration=Release /p:Platform=x86 /m /nologo /v:m
      - name: Package and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem -Recurse -Filter Legend.exe | Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
          Write-Host "Found exe: $($exe.FullName)"
          $dir = Split-Path $exe.FullName
          Get-ChildItem $dir | Select-Object Name, Length
          Compress-Archive -Path "$dir/*" -DestinationPath ZirconClient-x86.zip
          gh release create "x86-$($env:GITHUB_RUN_ID)" ZirconClient-x86.zip --title "x86 build" --notes "auto build x86"
